<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<main class="main"><div class="container">
  <div class="grid-2">
    <div class="card">
      <div class="card-title"><i class="bi bi-trash3"></i> บันทึกทิ้งขยะ</div>
      <div class="form-group"><label class="form-label">ชนิดขยะ</label>
        <div class="d-flex gap-2"><select class="form-input" id="type"></select><button class="btn btn-outline" id="manage"><i class="bi bi-gear"></i></button></div></div>
      <div class="form-group"><label class="form-label">น้ำหนัก (กก.)</label><input type="number" step="0.01" class="form-input form-input-lg" id="weight"></div>
      <div class="form-group"><label class="form-label">วันเวลา</label>
        <div class="d-flex gap-2"><input type="datetime-local" class="form-input" id="at"><button class="btn btn-outline" id="resetAt"><i class="bi bi-arrow-counterclockwise"></i></button></div></div>
      <div class="form-group"><label class="form-label">หมายเหตุ</label><input class="form-input" id="remark"></div>
      <button class="btn btn-success btn-full btn-lg" id="save">บันทึก</button>
      <div class="mt-3" id="today"></div>
    </div>
    <div class="card">
      <div class="card-title"><i class="bi bi-clock-history"></i> ประวัติ</div>
      <div class="date-selector mb-2">
        <input type="date" class="date-input" id="from"> – <input type="date" class="date-input" id="to">
        <button class="date-btn" data-days="7">7 วัน</button><button class="date-btn" data-days="30">30 วัน</button><button class="date-btn" data-days="90">3 เดือน</button>
        <button class="btn btn-outline btn-sm" id="search">ค้นหา</button>
      </div>
      <div class="table-wrap"><table class="data-table" id="hist"></table></div>
      <div class="notice info mt-2">ใบนำส่งขยะ (Scrap List PDF) จะเพิ่มหลังได้รูปแบบเอกสารของไลน์นี้</div>
    </div>
  </div>
</div></main>

<div class="modal-overlay" id="typeModal"><div class="modal-content">
  <button class="modal-close" data-close-modal>&times;</button>
  <h3 class="modal-title">จัดการชนิดขยะ</h3>
  <div class="d-flex gap-2 mb-2"><input class="form-input" id="newType" placeholder="ชื่อชนิดใหม่"><button class="btn btn-primary" id="addType">เพิ่ม</button></div>
  <div id="typeList"></div>
</div></div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script>
(async function () {
  if (!UI.initPage('waste', 'ทิ้งขยะ', 'bi-trash3')) return;
  const $ = (id) => document.getElementById(id);
  let types = [];
  const reqIds = UI.requestIdKeeper();
  async function loadTypes() {
    const r = await API.get('getWasteTypes');
    types = r.success ? r.data : [];
    $('type').innerHTML = types.length ? types.map((t) => `<option>${UI.esc(t.typeName)}</option>`).join('') : '<option value="">ยังไม่มีชนิดขยะ — กดปุ่มเฟือง</option>';
    $('typeList').innerHTML = types.map((t) => `<div class="entry-card d-flex justify-between align-center">${UI.esc(t.typeName)}<button class="btn btn-outline btn-sm" data-del="${UI.esc(t.typeId)}"><i class="bi bi-trash"></i></button></div>`).join('');
  }
  async function loadToday() {
    const r = await API.get('getTodayWaste');
    if (!r.success) return;
    const sum = {};
    r.data.forEach((w) => { sum[w.wasteType] = (sum[w.wasteType] || 0) + w.weightKg; });
    $('today').innerHTML = '<div class="form-label">สรุปวันนี้</div>' + (Object.keys(sum).map((k) => `<div class="d-flex justify-between small"><span>${UI.esc(k)}</span><b>${UI.formatNumber(sum[k], 2)} กก.</b></div>`).join('') || '<div class="small text-gray">ยังไม่มี</div>');
  }
  async function loadHist() {
    const r = await API.get('getWasteHistory', { filters: { dateFrom: $('from').value, dateTo: $('to').value } });
    if (!r.success) return UI.showToast(r.message, 'error');
    $('hist').innerHTML = '<thead><tr><th>วันเวลา</th><th>ชนิด</th><th class="num">กก.</th><th>ผู้บันทึก</th><th>หมายเหตุ</th></tr></thead><tbody>' +
      (r.data.map((w) => `<tr><td>${UI.esc(w.timestamp)}</td><td>${UI.esc(w.wasteType)}</td><td class="num">${UI.formatNumber(w.weightKg, 2)}</td><td>${UI.esc(w.recorderName)}</td><td>${UI.esc(w.remark)}</td></tr>`).join('') || '<tr><td colspan="5" class="text-center text-gray">ไม่มีข้อมูล</td></tr>') + '</tbody>';
  }
  $('save').onclick = () => UI.withButton($('save'), async () => {
    const data = { wasteType: $('type').value, weightKg: Number($('weight').value) || 0, recordedAt: $('at').value, remark: $('remark').value.trim() };
    if (!data.wasteType) return UI.showToast('กรุณาเลือกชนิดขยะ', 'warning');
    if (data.weightKg <= 0) return UI.showToast('กรุณากรอกน้ำหนัก', 'warning');
    data.clientRequestId = reqIds.get(data);
    const r = await API.post('submitWaste', { data });
    if (!r.success) return UI.showToast(r.message, 'error');
    reqIds.reset();
    $('weight').value = ''; $('remark').value = ''; $('at').value = UI.nowLocalInput();
    UI.showToast('บันทึกแล้ว', 'success'); loadToday(); loadHist();
  });
  $('resetAt').onclick = () => { $('at').value = UI.nowLocalInput(); };
  $('manage').onclick = () => UI.openModal('typeModal');
  $('addType').onclick = () => UI.withButton($('addType'), async () => { const r = await API.post('addWasteType', { typeName: $('newType').value }); if (!r.success) return UI.showToast(r.message, 'error'); $('newType').value = ''; await loadTypes(); });
  $('typeList').addEventListener('click', async (e) => { const b = e.target.closest('[data-del]'); if (b && confirm('ลบชนิดนี้?')) { const r = await API.post('deleteWasteType', { typeId: b.dataset.del }); if (!r.success) UI.showToast(r.message, 'error'); loadTypes(); } });
  document.querySelectorAll('[data-days]').forEach((b) => b.onclick = () => { $('to').value = UI.getToday(); $('from').value = UI.addDays(UI.getToday(), -(Number(b.dataset.days) - 1)); loadHist(); });
  $('search').onclick = loadHist;

  $('at').value = UI.nowLocalInput(); $('to').value = UI.getToday(); $('from').value = UI.addDays(UI.getToday(), -6);
  UI.showLoading(); await Promise.all([loadTypes(), loadToday(), loadHist()]); UI.hideLoading();
})();
</script>
</body>
</html>
