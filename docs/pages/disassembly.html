<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>รอแยกส่วน</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23fff%22/%3E%3Crect x=%229%22 y=%2211%22 width=%227%22 height=%2242%22 rx=%222%22 fill=%22%23C8102E%22/%3E%3Crect x=%2248%22 y=%2211%22 width=%227%22 height=%2242%22 rx=%222%22 fill=%22%23C8102E%22/%3E%3Crect x=%2217.5%22 y=%2215%22 width=%223.2%22 height=%2235%22 rx=%221%22 fill=%22%237C818B%22/%3E%3Crect x=%2222%22 y=%2215%22 width=%223.2%22 height=%2235%22 rx=%221%22 fill=%22%237C818B%22/%3E%3Crect x=%2226.5%22 y=%2215%22 width=%223.2%22 height=%2235%22 rx=%221%22 fill=%22%237C818B%22/%3E%3Crect x=%2231%22 y=%2215%22 width=%223.2%22 height=%2235%22 rx=%221%22 fill=%22%237C818B%22/%3E%3Crect x=%2235.5%22 y=%2215%22 width=%223.2%22 height=%2235%22 rx=%221%22 fill=%22%237C818B%22/%3E%3Crect x=%2240%22 y=%2215%22 width=%223.2%22 height=%2235%22 rx=%221%22 fill=%22%237C818B%22/%3E%3Crect x=%2244.5%22 y=%2215%22 width=%223.2%22 height=%2235%22 rx=%221%22 fill=%22%237C818B%22/%3E%3Crect x=%2218.4%22 y=%2215%22 width=%221%22 height=%2235%22 fill=%22%23C9CDD4%22/%3E%3Crect x=%2222.9%22 y=%2215%22 width=%221%22 height=%2235%22 fill=%22%23C9CDD4%22/%3E%3Crect x=%2227.4%22 y=%2215%22 width=%221%22 height=%2235%22 fill=%22%23C9CDD4%22/%3E%3Crect x=%2231.9%22 y=%2215%22 width=%221%22 height=%2235%22 fill=%22%23C9CDD4%22/%3E%3Crect x=%2236.4%22 y=%2215%22 width=%221%22 height=%2235%22 fill=%22%23C9CDD4%22/%3E%3Crect x=%2240.9%22 y=%2215%22 width=%221%22 height=%2235%22 fill=%22%23C9CDD4%22/%3E%3Crect x=%2245.4%22 y=%2215%22 width=%221%22 height=%2235%22 fill=%22%23C9CDD4%22/%3E%3Crect x=%2215%22 y=%2221.5%22 width=%2234%22 height=%224%22 rx=%221%22 fill=%22%23C8102E%22/%3E%3Ccircle cx=%2219.1%22 cy=%2223.5%22 r=%221.1%22 fill=%22%237A0A1C%22/%3E%3Ccircle cx=%2223.6%22 cy=%2223.5%22 r=%221.1%22 fill=%22%237A0A1C%22/%3E%3Ccircle cx=%2228.1%22 cy=%2223.5%22 r=%221.1%22 fill=%22%237A0A1C%22/%3E%3Ccircle cx=%2232.6%22 cy=%2223.5%22 r=%221.1%22 fill=%22%237A0A1C%22/%3E%3Ccircle cx=%2237.1%22 cy=%2223.5%22 r=%221.1%22 fill=%22%237A0A1C%22/%3E%3Ccircle cx=%2241.6%22 cy=%2223.5%22 r=%221.1%22 fill=%22%237A0A1C%22/%3E%3Ccircle cx=%2246.1%22 cy=%2223.5%22 r=%221.1%22 fill=%22%237A0A1C%22/%3E%3Cpath d=%22M21 51 L32 31 L43 51 Z%22 fill=%22%23fff%22/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#141518">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Assembly M/C">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<main class="main"><div class="container">
  <div class="card">
    <div class="card-title"><i class="bi bi-box-arrow-in-down"></i> ลงงานรอแยกส่วนจาก Job Order</div>
    <div class="notice info">สำหรับงานที่ปั๊มออกมาแล้ว <b>ยังไม่ได้ลงยอด</b> และต้องนำไปแยกส่วน — ไม่นับเป็น FG และไม่นับยอด MO<br>
      งาน "รอแยกส่วน" จากหน้าคัดแยก จะเข้าคิวด้านล่างให้อัตโนมัติ (อ้างเลขงานคัดแยกเดิม)</div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Job Order *</label><select class="form-input" id="jo"></select></div>
      <div class="form-group"><label class="form-label">เครื่อง *</label><select class="form-input" id="machine"></select></div>
      <div class="form-group"><label class="form-label">วันที่ผลิต</label><input type="date" class="form-input" id="date"></div>
      <div class="form-group"><label class="form-label">กะ</label><select class="form-input" id="shift"><option value="Day">กะเช้า</option><option value="Night">กะดึก</option></select></div>
      <div class="form-group"><label class="form-label">จำนวนรอแยกส่วน (ชิ้น) *</label><input type="number" min="1" inputmode="numeric" class="form-input" id="qty"></div>
      <div class="form-group"><label class="form-label">หมายเหตุ</label><input class="form-input" id="remark" placeholder="เช่น อาการ NG"></div>
    </div>
    <div class="small text-gray mb-2" id="joInfo"></div>
    <button class="btn btn-primary btn-full btn-lg" id="register"><i class="bi bi-plus-lg"></i> ลงงานรอแยกส่วน</button>
  </div>

  <div class="card">
    <div class="card-title"><i class="bi bi-recycle"></i> คิวรอแยกส่วน <span class="small text-gray">(FIFO — เก่าสุดก่อน)</span><span class="spacer"></span>
      <select class="date-input" id="fRange"><option value="active">ค้าง + เสร็จวันนี้</option><option value="all">ทั้งหมด</option></select>
      <input class="date-input" id="fSearch" placeholder="ค้นหา" style="max-width:130px"></div>
    <div class="kpi-grid mb-2" id="kpi"></div>
    <div id="list" data-skeleton="list"></div>
  </div>
</div></main>

<div class="modal-overlay" id="resultModal"><div class="modal-content wide">
  <button class="modal-close" data-close-modal>&times;</button>
  <h3 class="modal-title" id="rTitle"></h3>
  <div class="small text-gray mb-2" id="rInfo"></div>
  <div class="form-group"><label class="form-label">จำนวน FG ที่แยกส่วนรอบนี้ (ชิ้น) *</label><input type="number" min="1" inputmode="numeric" class="form-input form-input-lg" id="rQty"></div>
  <div class="form-label">MAT ที่ได้จากการแยก (ตาม BOM)</div>
  <div id="rMats"></div>
  <button class="btn btn-success btn-full mt-2" id="rSave">บันทึกผล (บวกสะสม)</button>
</div></div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script>
(async function () {
  if (!UI.initPage('disassembly', 'รอแยกส่วน', 'bi-recycle')) return;
  const $ = (id) => document.getElementById(id);
  const STATUS = { pending: 'รอแยกส่วน', 'in-progress': 'กำลังแยกส่วน', completed: 'แยกเสร็จ', cancelled: 'ยกเลิก' };
  let machines = [], jobOrders = [], bomMap = {}, jobs = [], current = null;
  const reqIds = UI.requestIdKeeper(), resultIds = UI.requestIdKeeper();
  const fmt = (v) => UI.formatNumber(v);
  const fmtQ = (v) => { const n = Number(v); return isFinite(n) ? n.toLocaleString('th-TH', { maximumFractionDigits: 4 }) : '-'; };
  const ageDays = (d) => Math.max(0, Math.round((new Date(UI.getToday()) - new Date(d)) / 86400000));

  // ---------- ลงงานจาก Job Order ----------
  const selJo = () => jobOrders.find((j) => j.jobOrderId === $('jo').value);
  function fillMachines() {
    const jo = selJo();
    const ids = jo ? (jo.machineIds || []) : [];
    const list = !ids.length || ids.includes('ALL') ? machines : machines.filter((m) => ids.includes(m.machineId));
    $('machine').innerHTML = UI.machineOptions(list) || '<option value="">ไม่มีเครื่อง</option>';
    $('joInfo').textContent = jo ? `สินค้า ${jo.productCode} · แผน ${fmt(jo.plannedQty)} · สถานะ ${UI.statusLabel(jo.status)}` : '';
  }
  $('jo').onchange = fillMachines;

  $('register').onclick = () => UI.withButton($('register'), async () => {
    const data = { jobOrderId: $('jo').value, machineId: $('machine').value, date: $('date').value, shift: $('shift').value,
      totalQty: Number($('qty').value) || 0, remark: $('remark').value.trim() };
    if (!data.jobOrderId) return UI.showToast('กรุณาเลือก Job Order', 'warning');
    if (!data.machineId) return UI.showToast('กรุณาเลือกเครื่อง', 'warning');
    if (data.totalQty <= 0) return UI.showToast('กรุณากรอกจำนวนรอแยกส่วน', 'warning');
    data.clientRequestId = reqIds.get(data);
    const r = await API.post('submitDisassemblyJob', { data });
    if (!r.success) return UI.showToast(r.message, 'error');
    reqIds.reset();
    UI.showToast('ลงงาน ' + r.jobId, 'success'); $('qty').value = ''; $('remark').value = '';
    loadJobs();
  });

  // ---------- คิว ----------
  async function loadJobs() {
    const r = await API.get('getDisassemblyJobs', { filters: $('fRange').value === 'active' ? { active: true } : {} });
    if (!r.success) return UI.showToast(r.message, 'error');
    jobs = r.data; renderJobs();
  }
  function matSummary(j) {
    const ks = Object.keys(j.matDetails || {});
    if (!ks.length) return '';
    return '<div class="small mt-1">' + ks.map((k) => { const m = j.matDetails[k];
      return `<span class="fw-bold">${UI.esc(k)}</span> <span class="text-success">ได้คืน ${fmtQ(m.good)}</span>${Number(m.scrap) ? ` <span class="text-danger">เสีย ${fmtQ(m.scrap)}</span>` : ''}`; }).join(' · ') + '</div>';
  }
  function renderJobs() {
    const q = $('fSearch').value.trim().toLowerCase();
    const rows = jobs.filter((j) => !q || [j.jobId, j.sourceRef, j.machineId, j.productCode, j.jobOrderId, j.remark].join(' ').toLowerCase().includes(q));
    const open = jobs.filter((j) => j.status === 'pending' || j.status === 'in-progress');
    const left = open.reduce((s, j) => s + j.totalQty - j.doneQty, 0);
    const oldest = open.length ? ageDays(open[0].date) : 0;
    $('kpi').innerHTML = `<div class="kpi-card warning"><div class="kpi-value">${open.length}</div><div class="kpi-label">งานค้าง</div></div>
      <div class="kpi-card"><div class="kpi-value">${fmt(left)}</div><div class="kpi-label">ชิ้นที่รอแยกส่วน</div></div>
      <div class="kpi-card ${oldest > 3 ? 'danger' : ''}"><div class="kpi-value">${oldest}</div><div class="kpi-label">วัน (งานค้างเก่าสุด)</div></div>`;
    const nextId = (jobs.find((j) => j.status === 'pending') || {}).jobId;
    $('list').innerHTML = rows.length ? rows.map((j) => {
      const pct = j.totalQty ? Math.min(100, j.doneQty / j.totalQty * 100) : 0;
      const src = j.sourceType === 'sorting' ? `จากคัดแยก <b>${UI.esc(j.sourceRef)}</b>` : `จาก Job Order <b>${UI.esc(j.sourceRef)}</b>`;
      const open = j.status === 'pending' || j.status === 'in-progress';
      return `<div class="entry-card ${j.status === 'cancelled' ? 'cancelled' : ''}">
        <div class="entry-head"><span>${UI.esc(j.jobId)} ${j.jobId === nextId ? '<span class="badge badge-info">คิวถัดไป</span>' : ''}</span>
          <span class="badge badge-${j.status}">${STATUS[j.status] || j.status}</span></div>
        <div class="entry-meta">${src} · ผลิต ${UI.formatDate(j.date)}${open ? ` <span class="${ageDays(j.date) > 3 ? 'text-danger' : ''}">(ค้าง ${ageDays(j.date)} วัน)</span>` : ''} · ${UI.esc(j.machineId)} · ${UI.esc(j.productCode)} · ${UI.esc(UI.shiftLabel(j.shift))}${j.jobOrderId && j.sourceType === 'sorting' ? ' · ' + UI.esc(j.jobOrderId) : ''}
          <br>${j.remark ? UI.esc(j.remark) + ' · ' : ''}ลงโดย ${UI.esc(j.registeredByName)}${j.workedByName ? ' · แยกโดย ' + UI.esc(j.workedByName) : ''}</div>
        <div class="d-flex justify-between small mt-1"><span>แยกแล้ว ${fmt(j.doneQty)}/${fmt(j.totalQty)}</span><span>คงเหลือ ${fmt(Math.max(0, j.totalQty - j.doneQty))}</span></div>
        <div class="progress-bar-container mt-1"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
        ${matSummary(j)}
        <div class="entry-actions">
          ${j.status === 'pending' ? `<button class="btn btn-primary btn-sm" data-act="pull" data-id="${j.jobId}">ดึงงาน</button>` : ''}
          ${j.status === 'in-progress' ? `<button class="btn btn-success btn-sm" data-act="result" data-id="${j.jobId}">บันทึกผล</button>` : ''}
          ${j.status === 'in-progress' && !j.doneQty ? `<button class="btn btn-outline btn-sm" data-act="return" data-id="${j.jobId}">คืนงาน</button>` : ''}
          ${j.status === 'pending' && j.sourceType === 'joborder' ? `<button class="btn btn-outline btn-sm" data-act="cancel" data-id="${j.jobId}">ยกเลิก</button>` : ''}
        </div></div>`;
    }).join('') : UI.emptyState('bi-recycle', 'ไม่มีงานรอแยกส่วน');
  }
  $('list').addEventListener('click', async (e) => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const id = b.dataset.id, act = b.dataset.act;
    if (act === 'result') return openResult(jobs.find((j) => j.jobId === id));
    if (act === 'cancel' && !await UI.confirm({ title: 'ยกเลิกงาน ' + id + '?', danger: true })) return;
    UI.withButton(b, async () => {
      const r = await API.post({ pull: 'pullDisassemblyJob', return: 'returnDisassemblyJob', cancel: 'cancelDisassemblyJob' }[act], { jobId: id });
      if (!r.success) return UI.showToast(r.message, 'error');
      await loadJobs();
    });
  });
  $('fRange').onchange = loadJobs; $('fSearch').oninput = renderJobs;

  // ---------- บันทึกผล ----------
  function openResult(j) {
    current = j;
    const left = Math.max(0, j.totalQty - j.doneQty);
    $('rTitle').textContent = 'บันทึกผล ' + j.jobId;
    $('rInfo').textContent = `${j.productCode} · คงเหลือ ${fmt(left)} ชิ้น · ${j.sourceType === 'sorting' ? 'จากคัดแยก' : 'จาก Job Order'} ${j.sourceRef}`;
    $('rQty').value = left || '';
    const bom = bomMap[j.productCode] || [];
    $('rMats').innerHTML = bom.length
      ? `<div class="table-wrap"><table class="data-table"><thead><tr><th>รหัส MAT</th><th class="num">ต่อ FG</th><th class="num">ควรได้</th><th class="num">ได้คืน (ดี)</th><th class="num">MAT เสีย</th></tr></thead><tbody>
        ${bom.map((c) => `<tr data-code="${UI.esc(c.componentCode)}" data-name="${UI.esc(c.componentName || '')}" data-per="${Number(c.qtyPerUnit) || 0}">
          <td title="${UI.esc(c.componentName || '')}"><span class="fw-bold">${UI.esc(c.componentCode)}</span><div class="small text-gray">${UI.esc(c.componentName || '')}</div></td>
          <td class="num">${fmtQ(c.qtyPerUnit)}</td><td class="num" data-exp></td>
          <td><input type="number" min="0" step="any" inputmode="decimal" class="form-input" style="width:110px" data-good></td>
          <td><input type="number" min="0" step="any" inputmode="decimal" class="form-input" style="width:110px" data-scrap></td></tr>`).join('')}
        </tbody></table></div><div class="form-hint">ช่อง "ได้คืน" เติมให้ตาม BOM อัตโนมัติ — แก้ได้ (ได้คืน + เสีย ควรเท่ากับ "ควรได้")</div>`
      : '<div class="notice">สินค้านี้ยังไม่มี BOM — บันทึกได้เฉพาะจำนวนที่แยก (ตั้ง BOM ที่ จัดการ → สินค้า / BOM)</div>';
    syncExpected(true);
    UI.openModal('resultModal');
  }
  /** ควรได้ = จำนวน FG × ต่อ FG ; เติม "ได้คืน" อัตโนมัติจนกว่าผู้ใช้จะแก้เอง */
  function syncExpected(reset) {
    const qty = Number($('rQty').value) || 0;
    $('rMats').querySelectorAll('tr[data-code]').forEach((tr) => {
      const exp = qty * Number(tr.dataset.per);
      tr.querySelector('[data-exp]').textContent = fmtQ(exp);
      const g = tr.querySelector('[data-good]'), s = tr.querySelector('[data-scrap]');
      if (reset) { g.dataset.touched = ''; s.value = ''; }
      if (!g.dataset.touched) g.value = Math.max(0, exp - (Number(s.value) || 0)) || '';
    });
  }
  $('rQty').addEventListener('input', () => syncExpected(false));
  $('rMats').addEventListener('input', (e) => {
    if (e.target.matches('[data-good]')) e.target.dataset.touched = '1';
    if (e.target.matches('[data-scrap]')) syncExpected(false);
  });
  $('rSave').onclick = () => UI.withButton($('rSave'), async () => {
    const qty = Number($('rQty').value) || 0;
    if (qty <= 0) return UI.showToast('กรุณากรอกจำนวนที่แยกส่วน', 'warning');
    if (qty > current.totalQty - current.doneQty) return UI.showToast('จำนวนเกินที่คงเหลือ', 'warning');
    const mats = {};
    $('rMats').querySelectorAll('tr[data-code]').forEach((tr) => {
      const good = Number(tr.querySelector('[data-good]').value) || 0, scrap = Number(tr.querySelector('[data-scrap]').value) || 0;
      if (good + scrap > 0) mats[tr.dataset.code] = { name: tr.dataset.name, good, scrap };
    });
    const result = { qty, mats };
    const clientRequestId = resultIds.get({ jobId: current.jobId, result });
    const r = await API.post('recordDisassemblyResult', { jobId: current.jobId, result, clientRequestId });
    if (!r.success) return UI.showToast(r.message, 'error');
    resultIds.reset();
    UI.closeModal('resultModal'); UI.showToast(r.completed ? 'แยกส่วนครบแล้ว' : 'บันทึกผลแล้ว', 'success'); loadJobs();
  });

  UI.showLoading();
  try {
    const [m, jo, b] = await Promise.all([API.get('getMachines'), API.get('getJobOrderOptions', { filters: { includeAll: true } }), API.get('getAllProductsWithBOM', { includeInactive: true })]);
    machines = m.success ? m.data.filter((x) => x.installed) : [];
    jobOrders = jo.success ? jo.data.filter((j) => j.status !== 'cancelled') : [];
    (b.success ? b.data : []).forEach((p) => { bomMap[p.productCode] = p.bom || []; });
    $('jo').innerHTML = '<option value="">— เลือก Job Order —</option>' + jobOrders.map((j) => `<option value="${UI.esc(j.jobOrderId)}">${UI.esc(j.jobOrderId)} · ${UI.esc(j.productCode)} (${UI.esc(UI.statusLabel(j.status))})</option>`).join('');
    $('date').max = UI.getToday(); $('date').value = UI.getToday();
    $('shift').value = UI.getShiftInfo().shiftDN;
    fillMachines();
    await loadJobs();
  } catch (err) { UI.showToast(err.message, 'error'); }
  UI.hideLoading();
})();
</script>
</body>
</html>
