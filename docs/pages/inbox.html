<body>
<main class="main"><div class="container">
  <div class="card">
    <div class="card-title"><i class="bi bi-inbox"></i> ข้อความของฉัน <span class="spacer"></span>
      <button class="btn btn-outline btn-sm" id="reload"><i class="bi bi-arrow-clockwise"></i></button></div>
    <div id="list" data-skeleton="list"></div>
  </div>
</div></main>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script>
(async function () {
  if (!UI.initPage('inbox', 'Inbox', 'bi-inbox')) return;
  const $ = (id) => document.getElementById(id);
  let items = [];
  async function load() {
    const r = await API.get('getInbox');
    if (!r.success) return UI.showToast(r.message, 'error');
    items = r.data;
    $('list').innerHTML = items.length ? items.map((m) => `
      <div class="entry-card" data-id="${UI.esc(m.inboxId)}" style="cursor:pointer;${m.status === 'unread' ? 'border-left:4px solid var(--primary)' : ''}">
        <div class="entry-head"><span>${UI.esc(m.title)}</span>${m.status === 'unread' ? '<span class="badge badge-info">ใหม่</span>' : ''}</div>
        <div class="small mt-1">${UI.esc(m.message)}</div>
        <div class="entry-meta">${UI.formatDate(m.createdAt, true)} · ${UI.esc(m.createdBy)}</div>
      </div>`).join('') : UI.emptyState('bi-envelope-open', 'ไม่มีข้อความ');
  }
  $('list').addEventListener('click', async (e) => {
    const c = e.target.closest('[data-id]');
    if (!c) return;
    const m = items.find((x) => x.inboxId === c.dataset.id);
    if (m && m.status === 'unread') { await API.post('markInboxRead', { inboxId: m.inboxId }); load(); }
  });
  $('reload').onclick = load;
  UI.showLoading(); await load(); UI.hideLoading();
})();
</script>
</body>
</html>
