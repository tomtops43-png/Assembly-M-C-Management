<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Inbox</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23C8102E'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='700' font-size='26' fill='white' text-anchor='middle'%3EAM%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<main class="main"><div class="container">
  <div class="card">
    <div class="card-title"><i class="bi bi-inbox"></i> ข้อความของฉัน <span class="spacer"></span>
      <button class="btn btn-outline btn-sm" id="reload"><i class="bi bi-arrow-clockwise"></i></button></div>
    <div id="list"></div>
  </div>
</div></main>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script>
(async function () {
  if (!UI.initPage('inbox', 'Inbox', 'bi-inbox')) return;
  const $ = (id) => document.getElementById(id);
  let items = [];
  async function load() {
    const r = await API.get('getInbox');
    if (!r.success) return UI.showToast(r.message, 'error');
    items = r.data;
    $('list').innerHTML = items.length ? items.map((m) => `
      <div class="entry-card" data-id="${UI.esc(m.inboxId)}" style="cursor:pointer;${m.status === 'unread' ? 'border-left:4px solid var(--primary)' : ''}">
        <div class="entry-head"><span>${UI.esc(m.title)}</span>${m.status === 'unread' ? '<span class="badge badge-info">ใหม่</span>' : ''}</div>
        <div class="small mt-1">${UI.esc(m.message)}</div>
        <div class="entry-meta">${UI.formatDate(m.createdAt, true)} · ${UI.esc(m.createdBy)}</div>
      </div>`).join('') : UI.emptyState('bi-envelope-open', 'ไม่มีข้อความ');
  }
  $('list').addEventListener('click', async (e) => {
    const c = e.target.closest('[data-id]');
    if (!c) return;
    const m = items.find((x) => x.inboxId === c.dataset.id);
    if (m && m.status === 'unread') { await API.post('markInboxRead', { inboxId: m.inboxId }); load(); }
  });
  $('reload').onclick = load;
  UI.showLoading(); await load(); UI.hideLoading();
})();
</script>
</body>
</html>
