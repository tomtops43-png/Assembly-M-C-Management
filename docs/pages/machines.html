<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>เครื่องจักร</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23fff%22/%3E%3Crect x=%229%22 y=%2211%22 width=%227%22 height=%2242%22 rx=%222%22 fill=%22%23C8102E%22/%3E%3Crect x=%2248%22 y=%2211%22 width=%227%22 height=%2242%22 rx=%222%22 fill=%22%23C8102E%22/%3E%3Crect x=%2217.5%22 y=%2215%22 width=%223.2%22 height=%2235%22 rx=%221%22 fill=%22%237C818B%22/%3E%3Crect x=%2222%22 y=%2215%22 width=%223.2%22 height=%2235%22 rx=%221%22 fill=%22%237C818B%22/%3E%3Crect x=%2226.5%22 y=%2215%22 width=%223.2%22 height=%2235%22 rx=%221%22 fill=%22%237C818B%22/%3E%3Crect x=%2231%22 y=%2215%22 width=%223.2%22 height=%2235%22 rx=%221%22 fill=%22%237C818B%22/%3E%3Crect x=%2235.5%22 y=%2215%22 width=%223.2%22 height=%2235%22 rx=%221%22 fill=%22%237C818B%22/%3E%3Crect x=%2240%22 y=%2215%22 width=%223.2%22 height=%2235%22 rx=%221%22 fill=%22%237C818B%22/%3E%3Crect x=%2244.5%22 y=%2215%22 width=%223.2%22 height=%2235%22 rx=%221%22 fill=%22%237C818B%22/%3E%3Crect x=%2218.4%22 y=%2215%22 width=%221%22 height=%2235%22 fill=%22%23C9CDD4%22/%3E%3Crect x=%2222.9%22 y=%2215%22 width=%221%22 height=%2235%22 fill=%22%23C9CDD4%22/%3E%3Crect x=%2227.4%22 y=%2215%22 width=%221%22 height=%2235%22 fill=%22%23C9CDD4%22/%3E%3Crect x=%2231.9%22 y=%2215%22 width=%221%22 height=%2235%22 fill=%22%23C9CDD4%22/%3E%3Crect x=%2236.4%22 y=%2215%22 width=%221%22 height=%2235%22 fill=%22%23C9CDD4%22/%3E%3Crect x=%2240.9%22 y=%2215%22 width=%221%22 height=%2235%22 fill=%22%23C9CDD4%22/%3E%3Crect x=%2245.4%22 y=%2215%22 width=%221%22 height=%2235%22 fill=%22%23C9CDD4%22/%3E%3Crect x=%2215%22 y=%2221.5%22 width=%2234%22 height=%224%22 rx=%221%22 fill=%22%23C8102E%22/%3E%3Ccircle cx=%2219.1%22 cy=%2223.5%22 r=%221.1%22 fill=%22%237A0A1C%22/%3E%3Ccircle cx=%2223.6%22 cy=%2223.5%22 r=%221.1%22 fill=%22%237A0A1C%22/%3E%3Ccircle cx=%2228.1%22 cy=%2223.5%22 r=%221.1%22 fill=%22%237A0A1C%22/%3E%3Ccircle cx=%2232.6%22 cy=%2223.5%22 r=%221.1%22 fill=%22%237A0A1C%22/%3E%3Ccircle cx=%2237.1%22 cy=%2223.5%22 r=%221.1%22 fill=%22%237A0A1C%22/%3E%3Ccircle cx=%2241.6%22 cy=%2223.5%22 r=%221.1%22 fill=%22%237A0A1C%22/%3E%3Ccircle cx=%2246.1%22 cy=%2223.5%22 r=%221.1%22 fill=%22%237A0A1C%22/%3E%3Cpath d=%22M21 51 L32 31 L43 51 Z%22 fill=%22%23fff%22/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
<style>
  .mc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .mc-card { position: relative; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 16px 14px; cursor: pointer; overflow: hidden; transition: border-color .15s, box-shadow .15s; }
  .mc-card::before { content: ''; position: absolute; left: 0; top: 0; right: 0; height: 4px; background: var(--success); }
  .mc-card:hover { border-color: var(--gray-light); box-shadow: 0 6px 18px rgba(22,23,27,.08); }
  .mc-card.maintenance::before { background: var(--warning); } .mc-card.down::before { background: var(--primary); }
  .mc-card.not-installed { opacity: .5; }
  .mc-name { font-weight: 800; font-size: 17px; }
  .tag { display: inline-block; font-size: 12px; padding: 3px 8px; border-radius: 5px; background: var(--bg); color: var(--ink-3); margin: 8px 4px 0 0; }
</style>
</head>
<body>
<main class="main"><div class="container">
  <div class="kpi-grid">
    <div class="kpi-card success"><div class="kpi-value" id="kRun">0</div><div class="kpi-label">ทำงาน</div></div>
    <div class="kpi-card warning"><div class="kpi-value" id="kMt">0</div><div class="kpi-label">ซ่อมบำรุง</div></div>
    <div class="kpi-card danger"><div class="kpi-value" id="kDown">0</div><div class="kpi-label">หยุดทำงาน</div></div>
  </div>
  <div class="card">
    <div class="card-title"><i class="bi bi-cpu"></i> <span id="lineTitle"></span><span class="spacer"></span>
      <button class="btn btn-outline btn-sm" id="refresh"><i class="bi bi-arrow-clockwise"></i> รีเฟรช</button></div>
    <div id="grid"></div>
  </div>
</div></main>

<div class="modal-overlay" id="mcModal"><div class="modal-content">
  <button class="modal-close" data-close-modal>&times;</button>
  <h3 class="modal-title" id="mTitle"></h3>
  <div class="kpi-grid" id="mStats"></div>
  <div class="form-group">
    <label class="form-label">กำลังผลิตสินค้า</label>
    <div id="mProducts"></div>
  </div>
  <div class="form-group">
    <label class="form-label">Job Order</label>
    <select class="form-input" id="mJo"></select>
  </div>
  <div id="mAssign" class="hidden form-group">
    <label class="form-label">สินค้าที่เครื่องนี้ผลิตได้ (หัวหน้า)</label>
    <div class="d-flex gap-2"><select class="form-input" id="mAssignSel"></select><button class="btn btn-outline" id="mAssignBtn">เพิ่ม</button></div>
    <div class="chips mt-2" id="mAssigned"></div>
  </div>
  <button class="btn btn-primary btn-full" id="mSave">บันทึกการตั้งค่า</button>
</div></div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script>
(async function () {
  if (!UI.initPage('machines', 'สถานะเครื่องจักร', 'bi-gear')) return;
  const $ = (id) => document.getElementById(id);
  const isSup = Auth.hasRole('supervisor');
  let machines = [], products = [], joProgress = {}, current = null;

  async function load() {
    const [m, p] = await Promise.all([API.get('getMachines'), products.length ? null : API.get('getProducts')]);
    if (!m.success) return UI.showToast(m.message, 'error');
    machines = m.data;
    if (p && p.success) products = p.data;
    render();
  }
  async function loadProgress() {
    const r = await API.get('getMachineJobOrderProgress');
    if (r.success) { joProgress = r.data; render(); }
  }

  function render() {
    $('lineTitle').textContent = `${APP_CONFIG.LINE_NAME} Line ${machines.filter((m) => m.installed).length} เครื่อง`;
    $('kRun').textContent = machines.filter((m) => m.installed && m.status === 'running').length;
    $('kMt').textContent = machines.filter((m) => m.installed && m.status === 'maintenance').length;
    $('kDown').textContent = machines.filter((m) => m.installed && m.status === 'down').length;
    if (!machines.length) { $('grid').innerHTML = UI.emptyState('bi-gear', 'ยังไม่มีเครื่องจักร — admin เพิ่มได้ที่เมนู "จัดการ"'); return; }
    const icons = { running: 'bi-play-circle-fill text-success', maintenance: 'bi-tools text-warning', down: 'bi-stop-circle-fill text-danger' };
    const card = (m) => {
      const jo = joProgress[m.currentJobOrder];
      const pct = jo && jo.plannedQty ? Math.min(100, jo.actualQty / jo.plannedQty * 100) : 0;
      return `<div class="mc-card ${m.status} ${m.installed ? '' : 'not-installed'}" data-id="${UI.esc(m.machineId)}">
        <div class="d-flex justify-between align-center"><span class="mc-name"><i class="bi ${icons[m.status] || ''}"></i> ${UI.esc(m.machineName)}</span>
          <span class="badge badge-${m.status}">${UI.statusLabel(m.status)}</span></div>
        <div class="small text-gray">${UI.esc(m.machineId)} ${m.effectiveCapacity ? '· ' + UI.formatNumber(m.effectiveCapacity) + ' ชิ้น/ชม.' : ''} ${m.installed ? '' : '· ไม่ได้ติดตั้ง'}</div>
        <span class="tag"><i class="bi bi-box"></i> ${UI.esc(m.currentProduct || 'ยังไม่ตั้งสินค้า')}</span>
        ${m.currentJobOrder ? `<span class="tag"><i class="bi bi-calendar2-week"></i> ${UI.esc(m.currentJobOrder)}</span>` : ''}
        ${jo ? `<div class="progress-bar-container mt-2"><div class="progress-bar-fill ${pct >= 100 ? 'over' : pct >= 90 ? 'near' : ''}" style="width:${pct}%"></div></div>
          <div class="small text-gray mt-1">${UI.formatNumber(jo.actualQty)} / ${UI.formatNumber(jo.plannedQty)} (${jo.completionRate}%)</div>` : ''}
      </div>`;
    };
    $('grid').innerHTML = UI.groupMachines(machines).map((g) => `<div class="machine-group-title mt-2">${UI.esc(g.group)} · ${g.machines.length} เครื่อง</div>
      <div class="mc-grid mb-3">${g.machines.map(card).join('')}</div>`).join('');
  }

  $('grid').addEventListener('click', (e) => { const c = e.target.closest('[data-id]'); if (c) openMachine(c.dataset.id); });
  $('refresh').onclick = () => { load(); loadProgress(); };

  async function openMachine(id) {
    current = machines.find((m) => m.machineId === id);
    $('mTitle').textContent = `${current.machineName} (${current.machineId})${current.group ? ' · ' + current.group : ''}`;
    $('mStats').innerHTML = '<div class="small text-gray">กำลังโหลด...</div>';
    renderProducts(current.currentProduct);
    $('mAssign').classList.toggle('hidden', !isSup);
    renderAssigned();
    UI.openModal('mcModal');
    API.get('getMachineWithStats', { machineId: id }).then((r) => {
      if (!r.success) return;
      $('mStats').innerHTML = `
        <div class="kpi-card success"><div class="kpi-value">${UI.formatNumber(r.data.todayActual)}</div><div class="kpi-label">ยอดวันนี้</div></div>
        <div class="kpi-card"><div class="kpi-value">${r.data.todayEntries}</div><div class="kpi-label">รายการ</div></div>
        <div class="kpi-card danger"><div class="kpi-value">${r.data.openTickets}</div><div class="kpi-label">แจ้งซ่อมค้าง</div></div>`;
    });
    loadJoOptions(current.currentProduct, current.currentJobOrder);
  }

  function renderProducts(sel) {
    const opts = current.assignedProducts;
    $('mProducts').innerHTML = `<label class="perm-item"><input type="radio" name="mp" value="" ${!sel ? 'checked' : ''}> ไม่ระบุ</label>` +
      (opts.length ? opts.map((code) => {
        const p = products.find((x) => x.productCode === code);
        return `<label class="perm-item"><input type="radio" name="mp" value="${UI.esc(code)}" ${code === sel ? 'checked' : ''}> ${UI.esc(code)} ${p ? '— ' + UI.esc(p.productName) : ''}</label>`;
      }).join('') : '<div class="small text-gray">ยังไม่ได้กำหนดสินค้าให้เครื่องนี้</div>');
  }
  $('mProducts').addEventListener('change', () => loadJoOptions(selectedProduct(), ''));
  function selectedProduct() { const r = document.querySelector('input[name=mp]:checked'); return r ? r.value : ''; }

  async function loadJoOptions(productCode, selected) {
    $('mJo').innerHTML = '<option value="">ไม่ระบุ</option>';
    if (!productCode) return;
    const r = await API.get('getJobOrderOptions', { filters: { machineId: current.machineId, productCode } });
    if (!r.success) return;
    $('mJo').innerHTML = '<option value="">ไม่ระบุ</option>' + r.data.map((j) =>
      `<option value="${UI.esc(j.jobOrderId)}" ${j.jobOrderId === selected ? 'selected' : ''}>คิว ${j.queueNo || '-'} · ${UI.esc(j.jobOrderId)} · ${UI.formatNumber(j.plannedQty)} ชิ้น · ${UI.esc(j.priority)}</option>`).join('');
  }

  function renderAssigned() {
    if (!isSup) return;
    $('mAssignSel').innerHTML = products.filter((p) => !current.assignedProducts.includes(p.productCode))
      .map((p) => `<option value="${UI.esc(p.productCode)}">${UI.esc(p.productCode)} — ${UI.esc(p.productName)}</option>`).join('') || '<option value="">(ไม่มีสินค้าเพิ่ม)</option>';
    $('mAssigned').innerHTML = current.assignedProducts.map((c) => `<span class="chip">${UI.esc(c)} <button data-rm="${UI.esc(c)}">&times;</button></span>`).join('');
  }
  $('mAssignBtn').onclick = async () => {
    const code = $('mAssignSel').value;
    if (!code) return;
    const r = await API.post('assignProductToMachine', { machineId: current.machineId, productCode: code });
    if (!r.success) return UI.showToast(r.message, 'error');
    current.assignedProducts.push(code); renderAssigned(); renderProducts(selectedProduct());
  };
  $('mAssigned').addEventListener('click', async (e) => {
    const b = e.target.closest('[data-rm]');
    if (!b || !confirm('นำสินค้า ' + b.dataset.rm + ' ออกจากเครื่องนี้?')) return;
    const r = await API.post('removeProductFromMachine', { machineId: current.machineId, productCode: b.dataset.rm });
    if (!r.success) return UI.showToast(r.message, 'error');
    current.assignedProducts = current.assignedProducts.filter((c) => c !== b.dataset.rm); renderAssigned(); renderProducts(selectedProduct());
  });

  $('mSave').onclick = () => UI.withButton($('mSave'), async () => {
    const prod = selectedProduct(), jo = $('mJo').value;
    if (prod !== current.currentProduct) {
      const r = await API.post('setCurrentProduct', { machineId: current.machineId, productCode: prod });
      if (!r.success) return UI.showToast(r.message, 'error');
    }
    if (prod && jo !== (prod === current.currentProduct ? current.currentJobOrder : '')) {
      const r = await API.post('setCurrentJobOrder', { machineId: current.machineId, jobOrderId: jo });
      if (!r.success) return UI.showToast(r.message, 'error');
    }
    UI.closeModal('mcModal'); UI.showToast('บันทึกแล้ว', 'success'); load(); loadProgress();
  });

  UI.showLoading();
  await load();
  UI.hideLoading();
  loadProgress();
  setInterval(() => { if (!document.hidden) load(); }, 60000);
  setInterval(() => { if (!document.hidden) loadProgress(); }, 5 * 60000);
})();
</script>
</body>
</html>
