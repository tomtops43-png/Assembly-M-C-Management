<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>กรอกยอดผลิต</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23fff%22/%3E%3Crect x=%229%22 y=%2211%22 width=%227%22 height=%2242%22 rx=%222%22 fill=%22%23C8102E%22/%3E%3Crect x=%2248%22 y=%2211%22 width=%227%22 height=%2242%22 rx=%222%22 fill=%22%23C8102E%22/%3E%3Crect x=%2217.5%22 y=%2215%22 width=%223.2%22 height=%2235%22 rx=%221%22 fill=%22%237C818B%22/%3E%3Crect x=%2222%22 y=%2215%22 width=%223.2%22 height=%2235%22 rx=%221%22 fill=%22%237C818B%22/%3E%3Crect x=%2226.5%22 y=%2215%22 width=%223.2%22 height=%2235%22 rx=%221%22 fill=%22%237C818B%22/%3E%3Crect x=%2231%22 y=%2215%22 width=%223.2%22 height=%2235%22 rx=%221%22 fill=%22%237C818B%22/%3E%3Crect x=%2235.5%22 y=%2215%22 width=%223.2%22 height=%2235%22 rx=%221%22 fill=%22%237C818B%22/%3E%3Crect x=%2240%22 y=%2215%22 width=%223.2%22 height=%2235%22 rx=%221%22 fill=%22%237C818B%22/%3E%3Crect x=%2244.5%22 y=%2215%22 width=%223.2%22 height=%2235%22 rx=%221%22 fill=%22%237C818B%22/%3E%3Crect x=%2218.4%22 y=%2215%22 width=%221%22 height=%2235%22 fill=%22%23C9CDD4%22/%3E%3Crect x=%2222.9%22 y=%2215%22 width=%221%22 height=%2235%22 fill=%22%23C9CDD4%22/%3E%3Crect x=%2227.4%22 y=%2215%22 width=%221%22 height=%2235%22 fill=%22%23C9CDD4%22/%3E%3Crect x=%2231.9%22 y=%2215%22 width=%221%22 height=%2235%22 fill=%22%23C9CDD4%22/%3E%3Crect x=%2236.4%22 y=%2215%22 width=%221%22 height=%2235%22 fill=%22%23C9CDD4%22/%3E%3Crect x=%2240.9%22 y=%2215%22 width=%221%22 height=%2235%22 fill=%22%23C9CDD4%22/%3E%3Crect x=%2245.4%22 y=%2215%22 width=%221%22 height=%2235%22 fill=%22%23C9CDD4%22/%3E%3Crect x=%2215%22 y=%2221.5%22 width=%2234%22 height=%224%22 rx=%221%22 fill=%22%23C8102E%22/%3E%3Ccircle cx=%2219.1%22 cy=%2223.5%22 r=%221.1%22 fill=%22%237A0A1C%22/%3E%3Ccircle cx=%2223.6%22 cy=%2223.5%22 r=%221.1%22 fill=%22%237A0A1C%22/%3E%3Ccircle cx=%2228.1%22 cy=%2223.5%22 r=%221.1%22 fill=%22%237A0A1C%22/%3E%3Ccircle cx=%2232.6%22 cy=%2223.5%22 r=%221.1%22 fill=%22%237A0A1C%22/%3E%3Ccircle cx=%2237.1%22 cy=%2223.5%22 r=%221.1%22 fill=%22%237A0A1C%22/%3E%3Ccircle cx=%2241.6%22 cy=%2223.5%22 r=%221.1%22 fill=%22%237A0A1C%22/%3E%3Ccircle cx=%2246.1%22 cy=%2223.5%22 r=%221.1%22 fill=%22%237A0A1C%22/%3E%3Cpath d=%22M21 51 L32 31 L43 51 Z%22 fill=%22%23fff%22/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#141518">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Assembly M/C">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<main class="main"><div class="container">
  <div class="card">
    <div class="d-flex justify-between align-center flex-wrap gap-2">
      <span class="badge badge-info" id="shiftBadge"></span>
      <div class="d-flex align-center gap-2">
        <label class="small fw-bold">วันที่งาน</label>
        <input type="date" class="date-input" id="workDate">
      </div>
    </div>
    <div class="tabs mt-2 mb-0 hidden" id="modeTabs">
      <button class="tab-btn active" data-mode="hourly"><i class="bi bi-clock"></i> ลงรายชั่วโมง</button>
      <button class="tab-btn" data-mode="shift"><i class="bi bi-calendar2-check"></i> ลงยอดทั้งกะ</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title"><i class="bi bi-gear"></i> 1. เลือกเครื่องจักร</div>
    <div id="machineGrid" data-skeleton="grid"></div>
  </div>

  <div class="card hidden" id="formCard">
   <div id="hourlyForm">
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">2. ผลิตภัณฑ์</label>
        <div class="lock-field"><i class="bi bi-lock-fill"></i><span id="productText">-</span></div>
      </div>
      <div class="form-group">
        <label class="form-label">3. Job Order</label>
        <div class="lock-field"><i class="bi bi-lock-fill"></i><span id="joText">-</span></div>
      </div>
    </div>
    <div class="notice danger hidden" id="setupNotice"><i class="bi bi-exclamation-octagon-fill"></i> เครื่องนี้ยังตั้ง <b>ผลิตภัณฑ์</b> และ <b>Job Order</b> ไม่ครบ — ยังลงยอดไม่ได้ ให้หัวหน้าตั้งที่เมนู "เครื่องจักร" ก่อน</div>
    <div id="joProgress" class="hidden mb-3"></div>

    <div class="form-group">
      <label class="form-label">4. ช่วงเวลา</label>
      <div class="period-grid" id="periodGrid"></div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">5. ผลิตได้ (FG)</label>
        <input type="number" inputmode="numeric" class="form-input form-input-lg" id="actualQty">
      </div>
      <div class="form-group">
        <label class="form-label">NG รวม</label>
        <input type="number" class="form-input form-input-lg" id="defectQty" readonly value="0">
        <div class="form-hint" id="ngHint"></div>
      </div>
    </div>
    <div id="componentInputs"></div>
    <div class="form-group hidden" id="ngReasonGroup">
      <label class="form-label">หมายเหตุ NG <span class="req">*</span></label>
      <div class="d-flex gap-2"><select class="form-input" id="ngReason"></select>
        <button class="btn btn-outline" type="button" id="ngAdd"><i class="bi bi-plus-lg"></i> เพิ่มอาการ</button>
        <button class="btn btn-outline" type="button" id="ngDel" title="ลบอาการที่เลือกออกจากรายการ"><i class="bi bi-trash"></i></button></div>
      <input class="form-input mt-2 hidden" id="ngReasonOther" placeholder="ระบุอาการ">
    </div>
    <button class="btn btn-success btn-full btn-lg" id="submitBtn"><i class="bi bi-check2-circle"></i> บันทึกยอดผลิต</button>
   </div>

   <!-- ลงยอดทั้งกะ: Leader ลงครั้งเดียวตอนเลิกกะ (1 ครั้ง/เครื่อง/กะ) -->
   <div id="shiftForm" class="hidden">
    <div class="notice info"><i class="bi bi-info-circle"></i> ลงยอดรวมทั้งกะของ <b id="sfMachine">-</b> ครั้งเดียว — ลงได้ 1 ครั้งต่อเครื่องต่อกะ (ถ้ากะนี้มีการลงรายชั่วโมงไว้แล้ว จะลงแบบทั้งกะซ้ำไม่ได้)</div>
    <div class="form-group">
      <label class="form-label">2. กะที่จะลงยอด</label>
      <div class="choice-grid" id="sfShift">
        <button class="choice-btn" type="button" data-s="Day"><i class="bi bi-sun"></i>กะเช้า<small class="text-gray">08:00–19:59</small></button>
        <button class="choice-btn" type="button" data-s="Night"><i class="bi bi-moon"></i>กะดึก<small class="text-gray">20:00–07:59</small></button>
      </div>
      <div class="form-hint" id="sfShiftHint"></div>
    </div>
    <label class="form-label">3. ยอดแยกตามรุ่น / Job Order</label>
    <div id="sfLines"></div>
    <button class="btn btn-outline btn-full mb-3" type="button" id="sfAddLine"><i class="bi bi-plus-lg"></i> เพิ่มรุ่น / Job Order (กรณีเปลี่ยนรุ่นกลางกะ)</button>
    <div class="sf-summary" id="sfSummary"></div>
    <button class="btn btn-success btn-full btn-lg" id="sfSubmit"><i class="bi bi-check2-circle"></i> บันทึกยอดทั้งกะ</button>
   </div>
  </div>

  <div class="card">
    <div class="card-title"><i class="bi bi-clock-history"></i> รายการย้อนหลัง 2 วัน <span class="spacer"></span>
      <button class="btn btn-outline btn-sm" id="reloadEntries"><i class="bi bi-arrow-clockwise"></i></button></div>
    <div id="adminFilter" class="hidden d-flex gap-2 flex-wrap mb-2">
      <input type="date" class="date-input" id="fFrom"> <input type="date" class="date-input" id="fTo">
      <button class="btn btn-outline btn-sm" id="fApply">ค้นหา</button>
    </div>
    <div id="entries" data-skeleton="list"></div>
  </div>
</div></main>

<div class="modal-overlay" id="editModal"><div class="modal-content">
  <button class="modal-close" data-close-modal>&times;</button>
  <h3 class="modal-title">แก้ไขยอดผลิต</h3>
  <div class="form-row">
    <div class="form-group"><label class="form-label">FG</label><input type="number" class="form-input" id="eActual"></div>
    <div class="form-group"><label class="form-label">NG</label><input type="number" class="form-input" id="eDefect" readonly></div>
  </div>
  <div id="eComponents"></div>
  <div class="form-group"><label class="form-label">หมายเหตุ NG</label>
    <div class="d-flex gap-2"><select class="form-input" id="eReason"></select>
      <button class="btn btn-outline" type="button" id="eNgAdd"><i class="bi bi-plus-lg"></i> เพิ่มอาการ</button></div>
    <input class="form-input mt-2 hidden" id="eReasonOther" placeholder="ระบุอาการ"></div>
  <div class="btn-group">
    <button class="btn btn-primary flex-1" id="eSave">บันทึก</button>
    <button class="btn btn-danger" id="eDelete"><i class="bi bi-trash"></i> ลบ</button>
  </div>
</div></div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script>
(async function () {
  if (!UI.initPage('production', 'กรอกยอดผลิต', 'bi-clipboard-data')) return;
  const C = window.APP_CONFIG, P = C.STORAGE_PREFIX;
  const user = Auth.getUser();
  const MASTER_KEY = P + 'production_master_v1';
  const WD_KEY = P + 'production_workdate_' + user.employeeId;
  const $ = (id) => document.getElementById(id);
  const OTHER = 'อื่นๆ';

  let cfg = { ngReasons: [OTHER], defaultQty: 0 };
  let master = null;            // {machines, machineProducts, bom, version}
  let selMachine = null, selPeriod = UI.currentPeriod(), periodPicked = false;
  let entries = [];
  let pendingReqId = null, pendingSig = '';

  // ---------- วันที่งาน (เปลี่ยนวันตอน 08:00 — กะดึกหลังเที่ยงคืนยังนับเป็นวันเดิม) ----------
  function defaultWorkDate() { return UI.getToday(); }
  function initWorkDate() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(WD_KEY) || 'null'); } catch (e) {}
    const today = UI.getToday();
    $('workDate').max = today;
    $('workDate').value = saved && saved.setOn === today ? saved.value : defaultWorkDate();
  }
  $('workDate').addEventListener('change', () => {
    try { localStorage.setItem(WD_KEY, JSON.stringify({ value: $('workDate').value, setOn: UI.getToday() })); } catch (e) {}
  });
  let lastToday = UI.getToday();
  function rollover() {
    const t = UI.getToday();
    if (t !== lastToday) { lastToday = t; $('workDate').max = t; $('workDate').value = defaultWorkDate(); }
    const s = UI.getShiftInfo();
    $('shiftBadge').textContent = `${UI.shiftLabel(s.shiftDN)} · ${s.timePeriod}`;
    // ช่วงเวลาเลื่อนตามชั่วโมงปัจจุบัน (เปิดหน้าค้างไว้ข้ามชั่วโมง) — ยกเว้นผู้ใช้เลือกช่วงเองแล้ว
    if (!periodPicked && selPeriod !== UI.currentPeriod()) { selPeriod = UI.currentPeriod(); renderPeriods(); }
  }
  setInterval(rollover, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { rollover(); checkVersion(); } });

  // ---------- master cache + version ----------
  function loadCachedMaster() {
    try {
      const c = JSON.parse(localStorage.getItem(MASTER_KEY) || 'null');
      if (c && Date.now() - c.at < 86400000) return c.data;
    } catch (e) {}
    return null;
  }
  async function loadAll(forceMaster) {
    const cached = forceMaster ? null : loadCachedMaster();
    const res = await API.get('getProductionFormData', { include: cached ? '' : 'masters' });
    if (!res.success) { UI.showToast(res.message, 'error'); return; }
    if (cached && cached.version === res.data.version) master = cached;
    else if (res.data.machines) master = res.data;
    else return loadAll(true);
    try { localStorage.setItem(MASTER_KEY, JSON.stringify({ at: Date.now(), data: master })); } catch (e) {}
    entries = res.data.entries || [];
    renderMachines(); renderEntries();
    if (selMachine) {
      // โหลดข้อมูลเครื่องใหม่ (เช่น ทุก 1 นาที) — ถ้าสินค้า/JO ของเครื่องไม่เปลี่ยน คงตัวเลขที่กรอกค้างไว้
      const prev = selMachine;
      const typed = { actual: $('actualQty').value, comps: [...$('componentInputs').querySelectorAll('input[data-comp]')].map((i) => [i.dataset.comp, i.value]),
        reason: $('ngReason').value, other: $('ngReasonOther').value };
      selectMachine(prev.machineId);
      if (selMachine && selMachine.currentProduct === prev.currentProduct && selMachine.currentJobOrder === prev.currentJobOrder) {
        $('actualQty').value = typed.actual;
        typed.comps.forEach(([c, v]) => { const i = $('componentInputs').querySelector(`input[data-comp="${CSS.escape(c)}"]`); if (i) i.value = v; });
        if ([...$('ngReason').options].some((o) => o.value === typed.reason)) $('ngReason').value = typed.reason;
        $('ngReasonOther').value = typed.other;
        $('ngReasonOther').classList.toggle('hidden', $('ngReason').value !== OTHER);
        recalcNg();
      }
    }
  }
  async function checkVersion() {
    if (document.hidden || !master) return;
    const r = await API.get('getMasterDataVersion', {}, { retries: 0, silent: true });
    if (r.success && r.version !== master.version) { await loadAll(true); UI.showToast('อัปเดตข้อมูลเครื่อง/สินค้าแล้ว', 'info'); }
  }
  setInterval(checkVersion, 60000);

  // ---------- เครื่องจักร ----------
  function renderMachines() {
    const list = (master.machines || []).filter((m) => m.installed);
    if (!list.length) { $('machineGrid').innerHTML = UI.emptyState('bi-gear', 'ยังไม่มีเครื่องจักร — ให้ admin เพิ่มที่เมนู "จัดการ"'); return; }
    $('machineGrid').innerHTML = UI.machineGridHtml(list, (m) => `
      <button class="machine-btn status-${m.status} ${selMachine && selMachine.machineId === m.machineId ? 'active' : ''}" data-id="${UI.esc(m.machineId)}" ${m.status === 'down' ? 'disabled' : ''}>
        ${UI.esc(m.machineName)}<small>${m.currentProduct ? UI.esc(m.currentProduct) + (m.currentJobOrder ? '' : ' · <span class="text-danger">ยังไม่มี JO</span>') : 'ยังไม่ตั้งสินค้า'}</small></button>`);
  }
  $('machineGrid').addEventListener('click', (e) => {
    const b = e.target.closest('[data-id]');
    if (b) selectMachine(b.dataset.id);
  });

  // ลงยอดได้เฉพาะเครื่องที่ตั้งทั้งผลิตภัณฑ์และ Job Order แล้ว
  function isReady(m) { return !!(m && m.currentProduct && m.currentJobOrder); }

  function selectMachine(id) {
    selMachine = master.machines.find((m) => m.machineId === id);
    renderMachines();
    if (!selMachine) { $('formCard').classList.add('hidden'); return; }
    $('formCard').classList.remove('hidden');
    const prod = (master.machineProducts[id] || []).find((p) => p.productCode === selMachine.currentProduct);
    $('productText').textContent = selMachine.currentProduct
      ? selMachine.currentProduct + (prod ? ' — ' + prod.productName : '')
      : 'ยังไม่ได้ตั้งสินค้า — แจ้งหัวหน้าให้ตั้งที่เมนูเครื่องจักร';
    $('joText').textContent = selMachine.currentJobOrder || 'ยังไม่ได้เลือก Job Order — แจ้งหัวหน้าให้ตั้งที่เมนูเครื่องจักร';
    $('setupNotice').classList.toggle('hidden', isReady(selMachine));
    $('actualQty').value = prod ? prod.defaultQty : cfg.defaultQty;
    $('submitBtn').disabled = !isReady(selMachine);
    renderComponents($('componentInputs'), selMachine.currentProduct, {}, recalcNg);
    fillReasons($('ngReason'), selMachine.group);
    $('ngReasonOther').classList.toggle('hidden', $('ngReason').value !== OTHER);
    recalcNg();
    loadJoProgress();
    if (mode === 'shift' && sfMachineId !== id) resetShiftForm();
  }

  /** แผนต่อชั่วโมง = capacity ของสินค้าที่ผลิต → ของเครื่อง */
  function currentCapacity() {
    const prod = (master.machineProducts[selMachine.machineId] || []).find((p) => p.productCode === selMachine.currentProduct);
    return (prod && prod.capacity) || selMachine.effectiveCapacity || selMachine.capacity || 0;
  }

  async function loadJoProgress() {
    const box = $('joProgress');
    if (!selMachine.currentJobOrder) { box.classList.add('hidden'); return; }
    const r = await API.get('getJobOrderProgress', { jobOrderId: selMachine.currentJobOrder });
    if (!r.success) { box.classList.add('hidden'); return; }
    const j = r.data;
    const pct = j.plannedQty ? Math.min(100, j.actualQty / j.plannedQty * 100) : 0;
    const over = j.actualQty >= j.plannedQty;
    const near = !over && j.remaining <= j.plannedQty * 0.1;
    box.innerHTML = `<div class="d-flex justify-between small mb-1">
        <span>แผน <b>${UI.formatNumber(j.plannedQty)}</b></span><span>ผลิตแล้ว <b>${UI.formatNumber(j.actualQty)}</b></span>
        <span>${over ? 'เกินแผน' : 'คงเหลือ'} <b>${UI.formatNumber(over ? j.over : j.remaining)}</b></span></div>
      <div class="progress-bar-container"><div class="progress-bar-fill ${over ? 'over' : near ? 'near' : ''}" style="width:${pct}%"></div></div>
      ${over ? '<div class="notice danger mt-2">ครบตามแผนแล้ว — แจ้งหัวหน้าเปลี่ยน Job Order</div>' : near ? '<div class="small text-warning mt-1">ใกล้ครบ</div>' : ''}`;
    box.classList.remove('hidden');
  }

  // ---------- ช่วงเวลา ----------
  function renderPeriods() {
    $('periodGrid').innerHTML = UI.getTimePeriods().map((p) => {
      const h = Number(p.slice(0, 2));
      const icon = UI.isDayHour(h) ? (h >= 11 && h < 16 ? 'bi-sun-fill' : 'bi-sun') : 'bi-moon';
      return `<button class="period-btn ${p === selPeriod ? 'active' : ''}" data-p="${p}"><i class="bi ${icon}"></i> ${p.slice(0, 5)}</button>`;
    }).join('');
  }
  $('periodGrid').addEventListener('click', (e) => {
    const b = e.target.closest('[data-p]');
    if (b) { selPeriod = b.dataset.p; periodPicked = selPeriod !== UI.currentPeriod(); renderPeriods(); }
  });

  // ---------- NG ราย component ----------
  function renderComponents(container, productCode, values, onChange) {
    const bom = (master.bom || {})[productCode] || [];
    container.innerHTML = bom.length ? `<div class="form-row">${bom.map((c) => `
      <div class="form-group"><label class="form-label">NG ${UI.esc(c.componentName || c.componentCode)}</label>
      <input type="number" min="0" inputmode="numeric" class="form-input" data-comp="${UI.esc(c.componentCode)}" data-name="${UI.esc(c.componentName)}" value="${(values[c.componentCode] || {}).qty || ''}"></div>`).join('')}</div>`
      : `<div class="form-group"><label class="form-label">NG (ยังไม่มี BOM)</label><input type="number" min="0" inputmode="numeric" class="form-input" data-comp="" value="${values.__total || ''}"></div>`;
    container.querySelectorAll('input').forEach((i) => i.addEventListener('input', onChange));
  }
  function readComponents(container) {
    const out = {}; let total = 0; const qtys = [];
    container.querySelectorAll('input[data-comp]').forEach((i) => {
      const q = Math.max(0, Number(i.value) || 0);
      if (!i.dataset.comp) { total = q; return; }
      if (q > 0) { out[i.dataset.comp] = { componentName: i.dataset.name, qty: q }; qtys.push(q); }
    });
    if (qtys.length) total = cfg.defectAggregate === 'sum' ? qtys.reduce((a, b) => a + b, 0) : Math.max(...qtys);
    return { details: out, total };
  }
  function groupOf(machineId) { const m = master && master.machines.find((x) => x.machineId === machineId); return m ? m.group : ''; }
  function fillReasons(sel, group) { UI.fillNgSelect(sel, cfg, group); }
  UI.bindNgControls({ sel: $('ngReason'), other: $('ngReasonOther'), addBtn: $('ngAdd'), delBtn: $('ngDel'),
    getCfg: () => cfg, getGroup: () => (selMachine ? selMachine.group : '') });
  UI.bindNgControls({ sel: $('eReason'), other: $('eReasonOther'), addBtn: $('eNgAdd'),
    getCfg: () => cfg, getGroup: () => (editing ? groupOf(editing.machineId) : '') });
  function reasonValue(sel, other) {
    if (sel.value === OTHER) return other.value.trim() ? OTHER + ': ' + other.value.trim() : '';
    return sel.value;
  }
  function recalcNg() {
    const ng = readComponents($('componentInputs'));
    $('defectQty').value = ng.total;
    $('ngReasonGroup').classList.toggle('hidden', ng.total <= 0);
    const both = cfg.ngRowSeparate && ng.total > 0 && (Number($('actualQty').value) || 0) > 0;
    $('ngHint').textContent = both ? 'มีทั้ง FG และ NG → ระบบบันทึกแยกเป็น 2 รายการให้อัตโนมัติ'
      : (cfg.defectAggregate === 'sum' ? 'NG = ผลรวมของชิ้นส่วน' : 'NG = ค่าสูงสุดของชิ้นส่วน');
  }
  $('actualQty').addEventListener('input', recalcNg);
  $('ngReason').addEventListener('change', () => $('ngReasonOther').classList.toggle('hidden', $('ngReason').value !== OTHER));

  /** สรุปในกล่องยืนยัน: แถวข้อมูล + ช่อง FG / NG ตัวใหญ่ */
  function confirmSummary(rows, fg, ng) {
    return `<div class="dlg-rows">${rows.map(([k, v]) => `<div><span>${UI.esc(k)}</span><b>${UI.esc(v)}</b></div>`).join('')}</div>
      <div class="dlg-tiles"><div class="ok"><span>FG</span><b>${UI.formatNumber(fg)}</b></div><div class="${ng > 0 ? 'ng' : ''}"><span>NG</span><b>${UI.formatNumber(ng)}</b></div></div>`;
  }

  // ---------- บันทึก ----------
  $('submitBtn').onclick = () => UI.withButton($('submitBtn'), async () => {
    if (!selMachine || !selMachine.currentProduct) return UI.showToast('เครื่องนี้ยังไม่ได้ตั้งสินค้า', 'warning');
    if (!selMachine.currentJobOrder) return UI.showToast('เครื่องนี้ยังไม่ได้เลือก Job Order — ลงยอดไม่ได้', 'warning');
    const ng = readComponents($('componentInputs'));
    const remark = ng.total > 0 ? reasonValue($('ngReason'), $('ngReasonOther')) : '';
    if (ng.total > 0 && !remark) return UI.showToast('กรุณาระบุอาการ NG', 'warning');
    const data = {
      machineId: selMachine.machineId, productCode: selMachine.currentProduct, jobOrderId: selMachine.currentJobOrder,
      workDate: $('workDate').value, timePeriod: selPeriod, plannedQty: currentCapacity(),
      actualQty: Number($('actualQty').value) || 0, defectQty: ng.total, defectByComponent: ng.details, remark
    };
    const sig = JSON.stringify(data);
    if (sig !== pendingSig) { pendingSig = sig; pendingReqId = API.newRequestId(); }
    data.clientRequestId = pendingReqId;
    if (!await UI.confirm({ title: 'ยืนยันบันทึกยอดผลิต', icon: 'bi-clipboard-check', okText: 'บันทึก',
      html: confirmSummary([['เครื่อง', selMachine.machineName], ['ช่วงเวลา', data.timePeriod]], data.actualQty, data.defectQty) })) return;
    const res = await API.post('submitProduction', { data });
    if (res.settingsChanged) { UI.showToast(res.message, 'warning'); await loadAll(true); return; }
    if (!res.success) return UI.showToast(res.message, 'error');
    pendingSig = ''; pendingReqId = null; periodPicked = false; rollover();
    UI.showToast(res.duplicate ? 'รายการนี้บันทึกไว้แล้ว' : res.split ? 'บันทึกสำเร็จ (แยกเป็น FG 1 รายการ + NG 1 รายการ)' : 'บันทึกสำเร็จ', 'success');
    $('componentInputs').querySelectorAll('input').forEach((i) => { i.value = ''; });
    $('ngReason').value = ''; $('ngReasonOther').value = ''; recalcNg();
    loadEntries(); loadJoProgress();
  }).finally(() => { if (selMachine) $('submitBtn').disabled = !isReady(selMachine); });

  function machineName(id) { const m = master && master.machines.find((x) => x.machineId === id); return m ? m.machineName : id; }

  // ---------- โหมด: ลงรายชั่วโมง / ลงยอดทั้งกะ ----------
  const MODE_KEY = P + 'production_mode_' + user.employeeId;
  // ลงยอดทั้งกะ: เฉพาะ Admin (คนอื่นไม่เห็นแท็บ และ server ปฏิเสธ)
  const CAN_SHIFT = user.role === 'admin';
  let mode = 'hourly';
  if (CAN_SHIFT) {
    $('modeTabs').classList.remove('hidden');
    try { mode = localStorage.getItem(MODE_KEY) === 'shift' ? 'shift' : 'hourly'; } catch (e) {}
  }
  function applyMode() {
    document.querySelectorAll('#modeTabs [data-mode]').forEach((b) => b.classList.toggle('active', b.dataset.mode === mode));
    $('hourlyForm').classList.toggle('hidden', mode !== 'hourly');
    $('shiftForm').classList.toggle('hidden', mode !== 'shift');
    if (mode === 'shift') { applyDefaultShift(); if (selMachine) resetShiftForm(); }
  }
  $('modeTabs').addEventListener('click', (e) => {
    const b = e.target.closest('[data-mode]'); if (!b || b.dataset.mode === mode || !CAN_SHIFT) return;
    mode = b.dataset.mode;
    try { localStorage.setItem(MODE_KEY, mode); } catch (err) {}
    applyMode();
  });

  // ---------- ลงยอดทั้งกะ ----------
  let sfShift = 'Day', sfMachineId = '', sfLines = [];
  const joCache = {};
  const netHours = () => Number(cfg.netHoursPerShift) || 10.5;

  /** กะที่เพิ่งจบ/กำลังจะจบ: 08–11 น. = กะดึกของเมื่อวาน, 12–19 น. = กะเช้าวันนี้, 20–07 น. = กะเช้า (เพิ่งเลิก) / กะดึก */
  function applyDefaultShift() {
    const h = UI.getBkkHour(), today = UI.getToday();
    if (h >= 8 && h < 12) { sfShift = 'Night'; $('workDate').value = UI.addDays(today, -1); }
    else if (h >= 12 && h < 20) { sfShift = 'Day'; $('workDate').value = today; }
    else if (h >= 20) { sfShift = 'Day'; $('workDate').value = today; }
    else { sfShift = 'Night'; $('workDate').value = today; }
    renderShiftPick();
  }
  function renderShiftPick() {
    document.querySelectorAll('#sfShift [data-s]').forEach((b) => b.classList.toggle('active', b.dataset.s === sfShift));
    const d = $('workDate').value;
    $('sfShiftHint').textContent = sfShift === 'Day'
      ? `กะเช้า วันที่ ${UI.formatDate(d)} (08:00–19:59)`
      : `กะดึก เริ่ม ${UI.formatDate(d)} 20:00 – ${UI.formatDate(UI.addDays(d, 1))} 07:59`;
  }
  $('sfShift').addEventListener('click', (e) => { const b = e.target.closest('[data-s]'); if (b) { sfShift = b.dataset.s; renderShiftPick(); } });
  $('workDate').addEventListener('change', () => { if (mode === 'shift') renderShiftPick(); });

  const sfProducts = () => (selMachine && master.machineProducts[selMachine.machineId]) || [];
  const sfProduct = (code) => sfProducts().find((p) => p.productCode === code);
  const sfCap = (code) => { const p = sfProduct(code); return (p && p.capacity) || (selMachine && (selMachine.capacity || selMachine.effectiveCapacity)) || 0; };
  function newLine(productCode, jobOrderId) { return { productCode: productCode || '', jobOrderId: jobOrderId || '', hours: netHours(), actual: '', ng: [] }; }

  function resetShiftForm() {
    if (!selMachine) return;
    sfMachineId = selMachine.machineId;
    $('sfMachine').textContent = selMachine.machineName;
    sfLines = [newLine(selMachine.currentProduct, selMachine.currentJobOrder)];
    renderShiftPick();
    renderLines();
  }

  async function loadJoOptions(productCode) {
    const key = selMachine.machineId + '|' + productCode;
    if (!productCode) return [];
    if (!joCache[key]) {
      const r = await API.get('getJobOrderOptions', { filters: { machineId: selMachine.machineId, productCode } });
      joCache[key] = r.success ? r.data : [];
    }
    return joCache[key];
  }

  function ngRowHtml(li, ni, n, bom, group) {
    const reasons = UI.ngReasonList(cfg, group);
    return `<div class="sf-ng" data-li="${li}" data-ni="${ni}">
      <select class="form-input" data-f="reason"><option value="">— อาการ —</option>${reasons.map((r) => `<option ${r === n.reason ? 'selected' : ''}>${UI.esc(r)}</option>`).join('')}</select>
      ${bom.length ? `<select class="form-input" data-f="comp"><option value="">— ชิ้นส่วน —</option>${bom.map((c) => `<option value="${UI.esc(c.componentCode)}" ${c.componentCode === n.comp ? 'selected' : ''}>${UI.esc(c.componentName || c.componentCode)}</option>`).join('')}</select>` : ''}
      <input type="number" min="0" inputmode="numeric" class="form-input" data-f="qty" placeholder="จำนวน" value="${UI.esc(n.qty)}">
      <button class="btn btn-outline btn-sm" type="button" data-del-ng title="ลบ"><i class="bi bi-x-lg"></i></button>
      <input class="form-input sf-other ${n.reason === OTHER ? '' : 'hidden'}" data-f="other" placeholder="ระบุอาการ" value="${UI.esc(n.other || '')}">
    </div>`;
  }

  function renderLines() {
    const prods = sfProducts();
    const group = selMachine ? selMachine.group : '';
    $('sfLines').innerHTML = sfLines.map((l, i) => {
      const bom = ((master.bom || {})[l.productCode] || []);
      return `<div class="sf-line" data-li="${i}">
        <div class="d-flex justify-between align-center mb-2"><b>${sfLines.length > 1 ? 'รุ่นที่ ' + (i + 1) : 'รุ่น / Job Order'}</b>
          ${sfLines.length > 1 ? `<button class="btn btn-outline btn-sm" type="button" data-del-line><i class="bi bi-trash"></i> ลบบรรทัด</button>` : ''}</div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">รุ่นสินค้า</label><select class="form-input" data-f="productCode">
            <option value="">— เลือกรุ่น —</option>${prods.map((p) => `<option value="${UI.esc(p.productCode)}" ${p.productCode === l.productCode ? 'selected' : ''}>${UI.esc(p.productCode)} — ${UI.esc(p.productName || '')}</option>`).join('')}</select></div>
          <div class="form-group"><label class="form-label">Job Order</label><select class="form-input" data-f="jobOrderId"><option value="">กำลังโหลด...</option></select></div>
          <div class="form-group"><label class="form-label">ชม. ทำงาน</label><input type="number" min="0" max="12" step="0.5" inputmode="decimal" class="form-input" data-f="hours" value="${UI.esc(l.hours)}"></div>
        </div>
        <div class="form-group"><label class="form-label">ผลิตได้ทั้งกะ (FG)</label>
          <input type="number" min="0" inputmode="numeric" class="form-input form-input-lg" data-f="actual" value="${UI.esc(l.actual)}"></div>
        <label class="form-label">NG แยกตามอาการ</label>
        <div class="sf-ngs">${l.ng.map((n, ni) => ngRowHtml(i, ni, n, bom, group)).join('') || '<div class="small text-gray mb-2">ไม่มี NG</div>'}</div>
        <button class="btn btn-outline btn-sm" type="button" data-add-ng><i class="bi bi-plus-lg"></i> เพิ่ม NG</button>
        <div class="sf-line-sum small text-gray mt-2" data-sum></div>
      </div>`;
    }).join('');
    sfLines.forEach((l, i) => fillJoSelect(i));
    updateSummary();
  }

  async function fillJoSelect(i) {
    const l = sfLines[i];
    const sel = $('sfLines').querySelector(`.sf-line[data-li="${i}"] [data-f="jobOrderId"]`);
    if (!sel) return;
    if (!l.productCode) { sel.innerHTML = '<option value="">— เลือกรุ่นก่อน —</option>'; return; }
    const list = (await loadJoOptions(l.productCode)).slice();
    if (l.productCode === selMachine.currentProduct && selMachine.currentJobOrder && !list.some((j) => j.jobOrderId === selMachine.currentJobOrder)) {
      list.unshift({ jobOrderId: selMachine.currentJobOrder });
    }
    if (!l.jobOrderId && list.length === 1) l.jobOrderId = list[0].jobOrderId;
    sel.innerHTML = `<option value="">${list.length ? '— เลือก Job Order —' : 'ไม่มี Job Order ของรุ่นนี้'}</option>` +
      list.map((j) => `<option value="${UI.esc(j.jobOrderId)}" ${j.jobOrderId === l.jobOrderId ? 'selected' : ''}>${UI.esc(j.jobOrderId)}${j.queueNo ? ' (คิว ' + j.queueNo + ')' : ''}</option>`).join('');
    updateSummary();
  }

  const ngTotal = (l) => l.ng.reduce((s, n) => s + (Math.max(0, Number(n.qty) || 0)), 0);
  function updateSummary() {
    let fg = 0, ng = 0, plan = 0, hrs = 0;
    sfLines.forEach((l, i) => {
      const cap = sfCap(l.productCode), h = Number(l.hours) || 0, p = Math.round(cap * h);
      const a = Number(l.actual) || 0, n = ngTotal(l);
      fg += a; ng += n; plan += p; hrs += h;
      const el = $('sfLines').querySelector(`.sf-line[data-li="${i}"] [data-sum]`);
      if (el) el.innerHTML = `แผน <b>${UI.formatNumber(p)}</b> (${UI.formatNumber(cap)}/ชม. × ${h} ชม.) · FG <b>${UI.formatNumber(a)}</b> · NG <b>${UI.formatNumber(n)}</b>` +
        (p ? ` · ทำได้ <b>${Math.round(a / p * 100)}%</b>` : '');
    });
    const over = hrs > 12.5;
    $('sfSummary').innerHTML = `<div class="d-flex justify-between flex-wrap gap-2">
      <span>รวมทั้งกะ: FG <b class="text-success">${UI.formatNumber(fg)}</b></span><span>NG <b class="text-danger">${UI.formatNumber(ng)}</b></span>
      <span>แผน <b>${UI.formatNumber(plan)}</b></span><span class="${over ? 'text-danger' : ''}">ชม. รวม <b>${hrs}</b>${over ? ' (เกิน 1 กะ)' : ''}</span></div>`;
  }

  $('sfLines').addEventListener('input', (e) => {
    const f = e.target.dataset.f; if (!f) return;
    const ngEl = e.target.closest('.sf-ng'), lineEl = e.target.closest('.sf-line');
    if (ngEl) {
      const n = sfLines[+ngEl.dataset.li].ng[+ngEl.dataset.ni];
      n[f] = e.target.value;
      if (f === 'reason') ngEl.querySelector('[data-f="other"]').classList.toggle('hidden', n.reason !== OTHER);
    } else if (lineEl) {
      const l = sfLines[+lineEl.dataset.li];
      l[f] = e.target.value;
      if (f === 'productCode') { l.jobOrderId = ''; l.ng.forEach((n) => { n.comp = ''; }); renderLines(); return; }
    }
    updateSummary();
  });
  $('sfLines').addEventListener('click', (e) => {
    const lineEl = e.target.closest('.sf-line'); if (!lineEl) return;
    const li = +lineEl.dataset.li;
    if (e.target.closest('[data-add-ng]')) { sfLines[li].ng.push({ reason: '', comp: '', qty: '', other: '' }); renderLines(); }
    else if (e.target.closest('[data-del-ng]')) { sfLines[li].ng.splice(+e.target.closest('.sf-ng').dataset.ni, 1); renderLines(); }
    else if (e.target.closest('[data-del-line]')) { sfLines.splice(li, 1); spreadHours(); renderLines(); }
  });
  function spreadHours() { const h = Math.round(netHours() / sfLines.length * 2) / 2; sfLines.forEach((l) => { l.hours = h; }); }
  $('sfAddLine').onclick = () => { if (!selMachine) return; sfLines.push(newLine()); spreadHours(); renderLines(); };

  const sfReq = UI.requestIdKeeper();
  $('sfSubmit').onclick = () => UI.withButton($('sfSubmit'), async () => {
    if (!selMachine) return UI.showToast('กรุณาเลือกเครื่อง', 'warning');
    const lines = [];
    for (let i = 0; i < sfLines.length; i++) {
      const l = sfLines[i], no = sfLines.length > 1 ? ` (รุ่นที่ ${i + 1})` : '';
      if (!l.productCode) return UI.showToast('กรุณาเลือกรุ่นสินค้า' + no, 'warning');
      if (!l.jobOrderId) return UI.showToast('กรุณาเลือก Job Order' + no, 'warning');
      const ngItems = [];
      for (const n of l.ng) {
        const q = Number(n.qty) || 0; if (q <= 0) continue;
        if (!n.reason) return UI.showToast('กรุณาเลือกอาการ NG' + no, 'warning');
        if (n.reason === OTHER && !String(n.other || '').trim()) return UI.showToast('กรุณาระบุอาการ "อื่นๆ"' + no, 'warning');
        const comp = n.comp ? ((master.bom || {})[l.productCode] || []).find((c) => c.componentCode === n.comp) : null;
        ngItems.push({ reason: n.reason === OTHER ? OTHER + ': ' + n.other.trim() : n.reason, componentCode: n.comp || '', componentName: comp ? comp.componentName : '', qty: q });
      }
      if (!(Number(l.actual) > 0) && !ngItems.length) return UI.showToast('ยังไม่ได้ใส่ยอด FG/NG' + no, 'warning');
      lines.push({ productCode: l.productCode, jobOrderId: l.jobOrderId, hours: Number(l.hours) || 0, actualQty: Number(l.actual) || 0, ngItems });
    }
    const data = { machineId: selMachine.machineId, workDate: $('workDate').value, shiftDN: sfShift, lines };
    data.clientRequestId = sfReq.get(data);
    const fg = lines.reduce((s, l) => s + l.actualQty, 0), ng = lines.reduce((s, l) => s + l.ngItems.reduce((a, n) => a + n.qty, 0), 0);
    if (!await UI.confirm({ title: 'ยืนยันลงยอดทั้งกะ', icon: 'bi-calendar2-check', okText: 'บันทึก',
      html: confirmSummary([['เครื่อง', selMachine.machineName], ['กะ', UI.shiftLabel(sfShift) + ' · ' + UI.formatDate(data.workDate)]].concat(lines.length > 1 ? [['รุ่น/JO', lines.length + ' รายการ']] : []), fg, ng) })) return;
    const res = await API.post('submitProductionShift', { data });
    if (!res.success) return UI.showToast(res.message, 'error');
    sfReq.reset();
    UI.showToast(res.duplicate ? 'รายการนี้บันทึกไว้แล้ว' : `บันทึกยอดทั้งกะแล้ว (${res.rows} รายการ)`, 'success');
    resetShiftForm(); loadEntries();
  });

  // ---------- รายการย้อนหลัง ----------
  async function loadEntries() {
    const filters = user.role === 'admin' && $('fFrom').value ? { dateFrom: $('fFrom').value, dateTo: $('fTo').value || $('fFrom').value } : {};
    const r = await API.get('getEditableProductionEntries', { filters });
    if (r.success) { entries = r.data; renderEntries(); }
  }
  function renderEntries() {
    if (!entries.length) { $('entries').innerHTML = UI.emptyState('bi-inbox', 'ยังไม่มีรายการ'); return; }
    $('entries').innerHTML = entries.map((e) => `
      <div class="entry-card ${e.status === 'cancelled' ? 'cancelled' : ''}">
        <div class="entry-head"><span>${UI.esc(machineName(e.machineId))} ${e.shift ? '[' + UI.esc(e.shift) + ']' : ''}</span>
          <span><span class="text-success">${UI.formatNumber(e.actualQty)}</span> / ${UI.formatNumber(e.plannedQty)} ${e.defectQty ? `<span class="badge badge-down">NG ${e.defectQty}</span>` : ''}</span></div>
        <div class="entry-meta">${UI.formatDate(e.date)} (${e.timePeriod === 'Day' || e.timePeriod === 'Night' ? 'ทั้ง' + UI.shiftLabel(e.timePeriod) : UI.esc(e.timePeriod)}) · ${UI.esc(e.productCode)} ${e.jobOrderId ? '· JO ' + UI.esc(e.jobOrderId) : ''} ${e.remark ? '· ' + UI.esc(e.remark) : ''}
          ${user.role === 'admin' ? '· ' + UI.esc(e.employeeName) : ''}</div>
        ${e.canEdit ? `<div class="entry-actions"><button class="btn btn-outline btn-sm" data-edit="${e.logId}"><i class="bi bi-pencil"></i> แก้ไข/ลบ</button></div>` : ''}
      </div>`).join('');
  }
  $('entries').addEventListener('click', (e) => { const b = e.target.closest('[data-edit]'); if (b) openEdit(b.dataset.edit); });
  $('reloadEntries').onclick = loadEntries;
  $('fApply').onclick = loadEntries;

  let editing = null;
  function openEdit(logId) {
    editing = entries.find((x) => x.logId === logId);
    if (!editing) return;
    $('eActual').value = editing.actualQty;
    const vals = Object.assign({}, editing.defectDetails);
    if (!Object.keys(vals).length) vals.__total = editing.defectQty;
    const recalc = () => { $('eDefect').value = readComponents($('eComponents')).total; };
    renderComponents($('eComponents'), editing.productCode, vals, recalc);
    recalc();
    const eGroup = groupOf(editing.machineId);
    fillReasons($('eReason'), eGroup);
    const r = editing.remark || '';
    if (r.startsWith(OTHER + ':')) { $('eReason').value = OTHER; $('eReasonOther').value = r.slice(OTHER.length + 1).trim(); }
    else { $('eReason').value = UI.ngReasonList(cfg, eGroup).includes(r) ? r : ''; $('eReasonOther').value = ''; }
    $('eReasonOther').classList.toggle('hidden', $('eReason').value !== OTHER);
    UI.openModal('editModal');
  }
  $('eReason').addEventListener('change', () => $('eReasonOther').classList.toggle('hidden', $('eReason').value !== OTHER));
  $('eSave').onclick = () => UI.withButton($('eSave'), async () => {
    const ng = readComponents($('eComponents'));
    const remark = ng.total > 0 ? reasonValue($('eReason'), $('eReasonOther')) : '';
    if (ng.total > 0 && !remark) return UI.showToast('กรุณาระบุอาการ NG', 'warning');
    if (cfg.ngRowSeparate && ng.total > 0 && (Number($('eActual').value) || 0) > 0) {
      return UI.showToast('รายการเดียวใส่ได้อย่างใดอย่างหนึ่ง: FG หรือ NG — ถ้าต้องการเพิ่ม NG ให้บันทึกรายการใหม่', 'warning');
    }
    const res = await API.post('updateProductionEntry', { logId: editing.logId, updates: {
      actualQty: Number($('eActual').value) || 0, defectQty: ng.total, defectByComponent: ng.details, remark } });
    if (!res.success) return UI.showToast(res.message, 'error');
    UI.closeModal('editModal'); UI.showToast('แก้ไขแล้ว', 'success'); loadEntries();
  });
  $('eDelete').onclick = () => UI.withButton($('eDelete'), async () => {
    const reason = (await UI.prompt({ title: 'ลบรายการนี้?', message: 'กรุณาระบุเหตุผลที่ลบ', placeholder: 'เช่น ลงยอดผิดเครื่อง', okText: 'ลบรายการ', icon: 'bi-trash3', danger: true }) || '').trim();
    if (!reason) return;
    const res = await API.post('requestDeleteProduction', { logId: editing.logId, reason });
    if (!res.success) return UI.showToast(res.message, 'error');
    UI.closeModal('editModal'); UI.showToast('ลบรายการแล้ว', 'success'); loadEntries();
  });

  // ---------- start ----------
  initWorkDate(); rollover(); renderPeriods(); applyMode();
  if (user.role === 'admin') $('adminFilter').classList.remove('hidden');
  UI.showLoading();
  try {
    cfg = await UI.getLineConfig();
    await UI.loadNgReasons().catch(() => []);
    fillReasons($('ngReason'), '');
    await loadAll(false);
  } catch (err) { UI.showToast(err.message, 'error'); }
  UI.hideLoading();
})();
</script>
</body>
</html>
